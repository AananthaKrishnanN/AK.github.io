<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Aanantha Krishnan N.</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        /* Interactive Magma Flame Theme */
        :root {
            --bg-color: #0f0500; 
            --text-main: #fcebdc; 
            --text-muted: #c2886a;
            --text-bright: #ffffff;
            --accent: #ff4500; 
            --border: #3b1705;
            
            --mouse-x: 50vw;
            --mouse-y: 50vh;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            margin: 0;
            padding: 0;
            font-size: 16px;
            overflow-x: hidden;
        }

        /* The Interactive Black Hole Magma Background */
        .magma-bg {
            position: fixed;
            top: -5%; left: -5%; width: 110%; height: 110%; 
            z-index: -1;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(255, 69, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 69, 0, 0.05) 1px, transparent 1px),
                radial-gradient(circle at var(--mouse-x) var(--mouse-y), #000000 0%, rgba(0,0,0,0.8) 40px, transparent 120px),
                radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(255, 69, 0, 0.35) 80px, rgba(255, 140, 0, 0.1) 250px, transparent 450px);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
            background-position: 
                calc(var(--mouse-x) * -0.015) calc(var(--mouse-y) * -0.015),
                calc(var(--mouse-x) * -0.015) calc(var(--mouse-y) * -0.015),
                0 0, 0 0;
        }

        /* UNIFIED NAVIGATION */
        .main-nav {
            border-bottom: 1px solid var(--border);
            margin-bottom: 3rem;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 2rem 1rem 2rem;
            display: flex;
            gap: 2rem;
        }

        .nav-container a {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-container a:hover {
            color: var(--text-bright);
        }

        .nav-container a.active {
            color: var(--text-bright);
            font-weight: 600;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 1.15rem;
        }

        .content-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem 4rem 2rem;
            position: relative;
            z-index: 10;
        }

        .meta {
            font-size: 0.85rem;
            font-family: monospace;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: block;
            letter-spacing: 0.1em;
        }

        /* Split Contact Layout */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4rem;
            margin-top: 2rem;
        }

        @media (min-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr 1fr;
                gap: 2rem;
            }
        }

        .serif-heading {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 3.5rem;
            font-weight: 400;
            color: var(--text-bright);
            margin-top: 0;
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        .contact-left p {
            font-size: 1.2rem;
            margin-bottom: 3rem;
        }

        .primary-link {
            font-family: monospace;
            font-size: 1rem;
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: opacity 0.2s ease;
        }

        .primary-link:hover {
            opacity: 0.8;
        }

        .elsewhere-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .elsewhere-links a {
            font-family: monospace;
            font-size: 1rem;
            color: var(--text-bright);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: color 0.2s ease;
        }

        .elsewhere-links a:hover {
            color: var(--accent);
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .tag {
            background: transparent;
            border: 1px solid var(--border);
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
            border-radius: 50px; 
            color: var(--text-main);
        }
    </style>
</head>
<body>

<!-- Interactive Background Element -->
<div class="magma-bg"></div>

<!-- Unified Navigation Bar -->
<nav class="main-nav">
    <div class="nav-container">
        <a href="index.html">Intro</a>
        <a href="research.html">Research & Experience</a>
        <a href="contact.html" class="active">Contact</a>
    </div>
</nav>

<div class="content-container">
    <!-- 04 CONTACT SECTION -->
    <div class="contact-grid">
        
        <!-- Left Side -->
        <div class="contact-left">
            <h1 class="serif-heading">Let's Talk</h1>
            <p>Always open to interesting conversations and opportunities.</p>
            <a href="mailto:krishnavarathinam@gmail.com" class="primary-link">krishnavarathinam@gmail.com</a>
        </div>

        <!-- Right Side -->
        <div class="contact-right">
            <h1 class="serif-heading">Elsewhere</h1>
            <div class="elsewhere-links">
                <a href="https://drive.google.com/file/d/1ELw5-GfhtZPQdoPpLB-WOIL-xqNwwHk9/view?usp=drive_link" target="_blank">CV</a>
                <a href="https://www.linkedin.com/in/aananthakrishnan/" target="_blank">LinkedIn</a>
            </div>

            <span class="meta">Beyond Engineering</span>
            <div class="tag-container">
                <span class="tag">Strength Training</span>
                <span class="tag">Running & Swimming</span>
                <span class="tag">Exploring Nature</span>
                <span class="tag">Making Memories with Friends</span>
            </div>
        </div>

    </div>
</div>

<!-- Script for Interactive Magma Effect -->
<script>
    const bg = document.querySelector('.magma-bg');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let currentX = mouseX;
    let currentY = mouseY;
    
    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    function animateBg() {
        currentX += (mouseX - currentX) * 0.08;
        currentY += (mouseY - currentY) * 0.08;
        
        bg.style.setProperty('--mouse-x', `${currentX}px`);
        bg.style.setProperty('--mouse-y', `${currentY}px`);
        
        requestAnimationFrame(animateBg);
    }
    animateBg();
</script>

</body>
</html>
