<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Aanantha Krishnan N.</title>
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root {
            --bg: #0b0d0f;
            --panel: #111417;
            --text: #f2f4f5;
            --muted: #9ca3aa;
            --accent: #7cc4ff;
            --border: #252a2f;
            --border-strong: #353c43;
            --max-width: 1100px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.7;
            font-size: 16px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 42px 42px;
        }

        .main-nav {
            border-bottom: 1px solid var(--border);
            background: rgba(11, 13, 15, 0.96);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-container a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            padding-bottom: 0.35rem;
            border-bottom: 2px solid transparent;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .nav-container a:hover,
        .nav-container a.active {
            color: var(--text);
        }

        .nav-container a.active {
            border-bottom-color: var(--accent);
        }

        .content-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 4rem 2rem 6rem;
        }

        .page-label {
            margin-bottom: 1.5rem;
            color: var(--accent);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }

        .contact-left,
        .contact-right {
            background: var(--panel);
            padding: 3rem;
        }

        .contact-left {
            border-left: 3px solid var(--accent);
        }

        .section-heading {
            margin: 0 0 1rem;
            color: var(--text);
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
            font-weight: 700;
        }

        .contact-left p {
            max-width: 480px;
            margin: 0 0 2.5rem;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .primary-link {
            display: inline-block;
            color: var(--text);
            text-decoration: none;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.92rem;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 0.25rem;
        }

        .primary-link:hover {
            color: var(--accent);
        }

        .elsewhere-links {
            display: flex;
            gap: 1.5rem;
            margin: 0 0 3.5rem;
        }

        .elsewhere-links a {
            color: var(--text);
            text-decoration: none;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .elsewhere-links a:hover {
            color: var(--accent);
        }

        .meta {
            display: block;
            margin-bottom: 0.9rem;
            color: var(--accent);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
        }

        .tag {
            padding: 0.45rem 0.75rem;
            border: 1px solid var(--border-strong);
            background: #0d1012;
            color: var(--muted);
            font-size: 0.84rem;
        }

        @media (max-width: 800px) {
            .nav-container {
                gap: 1.1rem;
                padding-left: 1.2rem;
                padding-right: 1.2rem;
                flex-wrap: wrap;
            }

            .content-container {
                padding: 2rem 1.2rem 4rem;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }

            .contact-left,
            .contact-right {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html">Intro</a>
            <a href="research.html">Research &amp; Experience</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <main class="content-container">
        <div class="page-label">03 · Contact</div>

        <div class="contact-grid">
            <section class="contact-left">
                <h1 class="section-heading">Let's Talk</h1>
                <p>Always open to interesting conversations and opportunities.</p>
                <a href="mailto:krishnavarathinam@gmail.com" class="primary-link">
                    krishnavarathinam@gmail.com
                </a>
            </section>

            <section class="contact-right">
                <h2 class="section-heading">Elsewhere</h2>

                <div class="elsewhere-links">
                    <a href="https://drive.google.com/file/d/1ELw5-GfhtZPQdoPpLB-WOIL-xqNwwHk9/view?usp=drive_link" target="_blank" rel="noopener noreferrer">CV</a>
                    <a href="https://www.linkedin.com/in/aananthakrishnan/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                </div>

                <span class="meta">Beyond Engineering</span>

                <div class="tag-container">
                    <span class="tag">Strength Training</span>
                    <span class="tag">Running &amp; Swimming</span>
                    <span class="tag">Exploring Nature</span>
                    <span class="tag">Making Memories with Friends</span>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
